<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <title>Hotel Website - Rooms</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="roomm.css">
</head>

<body>
  <section class="room top" id="room">
    <div class="container">
      <div class="heading_top flex1">
        <div class="heading">
          <h5>RAISING COMFORT TO THE HIGHEST LEVEL</h5>
          <h2>Rooms & Suites</h2>
          <div class="button-box">
            <a href="../index.html" class="home-btn">HOME</a>
          </div>
        </div>
        
      </div>

      <div class="content grid">
        <div class="box">
          <div class="img">
            <img src="image/r1.jpg" alt="Room 1">
          </div>
          <div class="text">
            <h3>Classic Room</h3>
            <p> <span>Tk</span>8000 <span>/per night</span> </p>
          </div>
        </div>
        <div class="box">
          <div class="img">
            <img src="image/r2.jpg" alt="Room 2">
          </div>
          <div class="text">
            <h3>Classic Double Room</h3>
            <p> <span>Tk</span>9000 <span>/per night</span> </p>
          </div>
        </div>
        <div class="box">
          <div class="img">
            <img src="image/r3.jpg" alt="Room 3">
          </div>
          <div class="text">
            <h3>Premium Double Room</h3>
            <p> <span>Tk</span>10000 <span>/per night</span> </p>
          </div>
        </div>
        <!-- New Rooms -->
        <div class="box">
          <div class="img">
            <img src="image/r4.jpg" alt="Room 4">
          </div>
          <div class="text">
            <h3>Deluxe Suite</h3>
            <p> <span>Tk</span>10000 <span>/per night</span> </p>
          </div>
        </div>
        <div class="box">
          <div class="img">
            <img src="image/r5.jpg" alt="Room 5">
          </div>
          <div class="text">
            <h3>Standard Room</h3>
            <p> <span>Tk</span>8000 <span>/per night</span> </p>
          </div>
        </div>
        <div class="box">
          <div class="img">
            <img src="image/r6.jpg" alt="Room 6">
          </div>
          <div class="text">
            <h3>Executive Suite</h3>
            <p> <span>Tk</span>20000 <span>/per night</span> </p>
          </div>
        </div>
      </div>
    </div>
  </section>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guest Registration Form</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // Function to get query string parameters
    function getQueryStringParams(param) {
        let urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }

    // Function to display room type, price, total cost, and room numbers
    function displayRoomInfo() {
        let roomType = getQueryStringParams('room_type');
        let price = getQueryStringParams('price');
        let total_cost = getQueryStringParams('total_cost');
        let room_nos = getQueryStringParams('room_nos');
        document.getElementById('roomType').innerText = roomType;
        document.getElementById('price').innerText = price;
        document.getElementById('total_cost_display').innerText = total_cost;
        document.getElementById('total_cost').value = total_cost; // Set hidden input value
        document.getElementById('room_nos_display').innerText = room_nos;
        document.getElementById('room_nos').value = room_nos; // Set hidden input value
    }

    window.onload = displayRoomInfo;
  </script>
</head>
<body>
  <div class="background">
    <div class="booking-form">
      <h2>Guest Registration Form</h2>
      <p>Room Type: <span id="roomType"></span></p>
      <p>Price: <span id="price"></span></p>
      <p>Total cost: <span id="total_cost_display"></span></p>
      <p>Room Numbers: <span id="room_nos_display"></span></p>

      <form action="../guest/guest_info.php" method="post">
        <label for="NID">NID:</label>
        <input type="text" name="NID" id="NID" required>

        <label for="First_name">First Name:</label>
        <input type="text" name="First_name" id="First_name" required>

        <label for="Last_name">Last Name:</label>
        <input type="text" name="Last_name" id="Last_name" required>

        <label for="Mobile_no">Mobile no:</label>
        <input type="phone" name="Mobile_no" id="Mobile_no" required>

        <label for="Check_in_time">Check In:</label>
        <input type="date" name="Check_in_time" id="Check_in_time" required>
        
        <label for="Check_out_time">Check Out:</label>
        <input type="date" name="Check_out_time" id="Check_out_time" required>

        <!-- Hidden inputs to hold total cost and room numbers -->
        <input type="hidden" name="total_cost" id="total_cost">
        <input type="hidden" name="room_nos" id="room_nos">

        <button type="submit" name="sub">Book Now</button>
      </form>
    </div>
  </div>
</body>
</html>
